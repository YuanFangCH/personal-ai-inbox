# Keep this workflow definition registered after repository history cleanup.
name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.6'
          cache: true

      - name: Install Linux SQLite dependency
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Analyze
        run: flutter analyze

      - name: Test migration and secretary regressions
        run: >
          flutter test --reporter expanded
          test/agent_tool_executor_test.dart
          test/agent_task_store_test.dart
          test/agent_task_status_card_test.dart
          test/agent_budget_file_recovery_test.dart
          test/chat_activity_test.dart
          test/chat_service_agent_test.dart
          test/conversation_workspace_scheduler_test.dart
          test/conversation_workspace_agent_runtime_test.dart
          test/content_intake_test.dart
          test/model_duplicate_decision_source_test.dart
          test/table_action_processor_test.dart
          test/table_ai_runtime_test.dart
          test/chat_service_tools_test.dart
          test/conversation_lifecycle_test.dart
          test/conversation_large_history_ui_test.dart
          test/secretary_conversation_ui_test.dart
          test/app_background_lifecycle_test.dart
          test/settings_service_test.dart
          test/settings_page_test.dart
          test/device_preferences_test.dart
          test/ai_policy_test.dart
          test/conversation_store_test.dart
          test/conversation_permission_sheet_test.dart
          test/full_agent_recovery_test.dart
          test/full_agent_retry_test.dart
          test/file_input_service_test.dart
          test/chat_repository_trash_test.dart
          test/model_client_stream_test.dart
          test/local_retrieval_test.dart
          test/retrieval_pagination_test.dart
          test/sqlite_migration_coordinator_test.dart
          test/agent_context_manager_test.dart
          test/table_migration_service_test.dart
          test/table_migration_gate_test.dart
          test/table_migration_io_test.dart
          test/app_runtime_test.dart
          test/home_widget_bridge_test.dart
          test/home_widgets
          test/widget_tools_test.dart
